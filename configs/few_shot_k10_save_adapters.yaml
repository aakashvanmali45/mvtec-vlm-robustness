experiment_name: few_shot_k10_seed42_clip_siglip_save_adapters

prompts_config: configs/prompts.yaml
data_root: /kaggle/input/datasets/ipythonx/mvtec-ad
output_path: results/few_shot_k10_seed42_results.csv

# NEW: where to save trained LoRA adapters for later reuse.
adapter_save_dir: results/lora_adapters_k10_seed42

models:
  - clip
  - siglip

categories: all

# Only k=10 — this is a targeted training run for the corruption experiment,
# not a full sweep. The main few-shot sweep already has k=1,5,10.
k_values:
  - 10

# Only one seed — the corruption experiment uses seed=42 to keep compute manageable.
# If time permits later, extend to multiple seeds and average.
seeds:
  - 42

strategy: naive

lora:
  rank: 8
  alpha: 16
  target_modules: ["q_proj", "v_proj"]
  learning_rate: 0.0001
  weight_decay: 0.01
  epochs: 20
  batch_size: 8
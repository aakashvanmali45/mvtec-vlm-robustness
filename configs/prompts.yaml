# Prompt configurations for MVTec-AD zero-shot and few-shot experiments.
#
# Structure: category -> strategy -> [good_prompt, defective_prompt]
# Convention: index 0 = good, index 1 = defective.
#
# Three strategies at increasing specificity:
#   naive:             generic prompts, no domain knowledge
#   visual_primitive:  general visual language (continuous, broken, uniform, etc.)
#   category_specific: expert descriptions naming actual defect subtypes

bottle:
  naive:
    - "a photo of a good bottle"
    - "a photo of a defective bottle"
  visual_primitive:
    - "a photo of a bottle with a smooth continuous surface"
    - "a photo of a bottle with a broken or interrupted surface"
  category_specific:
    - "a top-down photo of a glass bottle showing a complete unbroken brown ring"
    - "a top-down photo of a glass bottle with a chipped edge, broken rim, or foreign contamination inside"

cable:
  naive:
    - "a photo of a good cable"
    - "a photo of a defective cable"
  visual_primitive:
    - "a photo of a cable with intact continuous structure"
    - "a photo of a cable with broken, missing, or damaged structure"
  category_specific:
    - "a cross-section photo of an electrical cable with three distinct colored wires inside intact insulation"
    - "a cross-section photo of an electrical cable with cut insulation, missing wires, swapped wire positions, or bent conductors"

